[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teaforge"
version = "0.1.0"
description = "Generate Program Check List (PCL) documents from pytest tests."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12,<1.0",
  "jinja2>=3.1,<4.0",
  "coverage>=7,<8",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62,<70"]
dev = [
  "pytest>=8.2,<9.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
]

[project.scripts]
teaforge = "teaforge.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "demo/fastapi_crud/tests"]
markers = [
  "normal: Normal value test",
  "boundary: Boundary value test",
  "exceptional: Exceptional value test",
]
