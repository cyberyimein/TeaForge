[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teaforge"
version = "0.2.0"
description = "Generate PCL test specifications and coverage reports from pytest, Jest, Angular, and Playwright tests."
readme = "README.md"
license = "MIT"
authors = [{name = "Magnus Wong"}]
requires-python = ">=3.11"
keywords = ["testing", "pytest", "jest", "coverage", "pcl", "mermaid"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "typer>=0.12,<1.0",
  "jinja2>=3.1,<4.0",
  "coverage>=7,<8",
  "pytest>=7,<9",
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-typescript>=0.23,<0.24",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62,<70"]
dev = [
  "build>=1.2,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.9,<1.0",
  "twine>=5,<7",
]

[project.urls]
Homepage = "https://github.com/cyberyimein/TeaForge"
Repository = "https://github.com/cyberyimein/TeaForge"
Issues = "https://github.com/cyberyimein/TeaForge/issues"

[project.scripts]
teaforge = "teaforge.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"teaforge.templates" = ["*.html"]
"teaforge.jest.assets" = ["*.cjs"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "demo/fastapi_crud/tests"]
markers = [
  "normal: Normal value test",
  "boundary: Boundary value test",
  "exceptional: Exceptional value test",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["teaforge"]

[tool.coverage.report]
fail_under = 80
show_missing = true
